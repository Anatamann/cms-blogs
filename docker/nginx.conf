worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent"';

  access_log /var/log/nginx/access.log main;
  sendfile on;
  keepalive_timeout 65;
  # Match app video cap (30MB) + multipart overhead
  client_max_body_size 35m;
  server_tokens off;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml text/xml;

  # Security headers (app also sets Helmet; nginx reinforces at edge)
  map $sent_http_content_type $cache_control {
    default "";
    ~*text/css "public, max-age=86400";
    ~*javascript "public, max-age=86400";
    ~*image/ "public, max-age=604800";
  }

  upstream ainme_app {
    server app:3000;
  }

  server {
    listen 80;
    server_name _;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Block access to hidden files
    location ~ /\. {
      deny all;
      access_log off;
      log_not_found off;
    }

    location /css/ {
      proxy_pass http://ainme_app;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      expires 1d;
      add_header Cache-Control "public, max-age=86400";
    }

    location /js/ {
      proxy_pass http://ainme_app;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      expires 1d;
      add_header Cache-Control "public, max-age=86400";
    }

    location /uploads/ {
      proxy_pass http://ainme_app;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      expires 7d;
      add_header Cache-Control "public, max-age=604800";
    }

    location /health {
      proxy_pass http://ainme_app;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      access_log off;
    }

    location / {
      proxy_pass http://ainme_app;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";
      proxy_hide_header X-Powered-By;
    }
  }
}
