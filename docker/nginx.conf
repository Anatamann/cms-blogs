worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent"';

  access_log /var/log/nginx/access.log main;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  # Match app video cap (30MB) + multipart overhead
  client_max_body_size 35m;
  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_min_length 1024;
  gzip_types
    text/plain
    text/css
    application/json
    application/javascript
    application/xml
    image/svg+xml
    text/xml
    application/rss+xml;

  upstream ainme_app {
    server app:3000;
    keepalive 16;
  }

  # Shared proxy headers for app
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 80;
    server_name _;

    # Security headers (app also sets Helmet; nginx reinforces at edge)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Block access to hidden files
    location ~ /\. {
      deny all;
      access_log off;
      log_not_found off;
    }

    # Static assets served through app (keeps one origin; simple deploy)
    location /css/ {
      proxy_pass http://ainme_app;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      expires 1d;
      add_header Cache-Control "public, max-age=86400";
    }

    location /js/ {
      proxy_pass http://ainme_app;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      expires 1d;
      add_header Cache-Control "public, max-age=86400";
    }

    # Homepage scroll frames + poster (immutable-ish public assets)
    location /videos/ {
      proxy_pass http://ainme_app;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      expires 7d;
      add_header Cache-Control "public, max-age=604800";
    }

    location /uploads/ {
      proxy_pass http://ainme_app;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      expires 7d;
      add_header Cache-Control "public, max-age=604800";
    }

    location /health {
      proxy_pass http://ainme_app;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      access_log off;
    }

    location / {
      proxy_pass http://ainme_app;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      # Set to https at the TLS terminator if you terminate SSL in front
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";
      proxy_hide_header X-Powered-By;
      proxy_read_timeout 120s;
      proxy_send_timeout 120s;
    }
  }
}
